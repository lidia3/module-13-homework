name: AgentOps Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OTEL_SDK_DISABLED: "true"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate retention policy
        run: python retention_policy.py
      - name: Validate PII and domain guards
        run: python safety_guards.py
      - name: Validate budgets and circuit breaker
        run: python sla.py

  golden-eval:
    if: github.event_name != 'pull_request'
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_FIXTURES: "true"
      OTEL_SDK_DISABLED: "true"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_ENDPOINT: https://eu.api.smith.langchain.com
      LANGSMITH_PROJECT: telco-churn-agentops-13-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check required secrets
        run: |
          test -n "$OPENROUTER_API_KEY"
          test -n "$LANGSMITH_API_KEY"
      - name: Accuracy and Relevance threshold gate
        run: python evaluate.py
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-evaluation
          path: evals/results.json
